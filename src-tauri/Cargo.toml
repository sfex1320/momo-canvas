[package]
name = "momo-canvas"
version = "0.1.0"
description = "MOMO 智能画布 - AI 创作智能画布工作站"
authors = ["PENG"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "momo_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
svg2pdf = "0.13"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# unsafe-headers：允许前端显式控制 Origin 头（传空 = 摘掉）。
# ComfyUI 等本地服务开着 DNS-rebinding 防护，Origin 与 Host 不一致会 403，
# 而插件默认无条件把 webview 的 Origin 塞进每个请求 —— 必须能摘。
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-drag = "2"
# 自动更新：安装版走 updater（GitHub Releases latest.json），便携版由前端下载 zip 替换
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Eagle 资产桥：大文件流式 SHA-256 指纹（版本与 Cargo.lock 既有条目一致，无需新下载）
sha2 = "0.10.9"
# Comfy 工作流无感同步：跨平台目录监听（Windows 后端 = ReadDirectoryChangesW，UNC 断链时会报错，前端退化为复扫）
notify = "8"
# DPAPI（API Key 落盘加密）：版本与 Cargo.lock 既有传递依赖一致，无需新下载
# Win32_UI_Shell / Win32_UI_WindowsAndMessaging / Win32_System_Com：便携版桌面快捷方式（IShellLink COM）
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

# —— 本地超分（阶段一）——
# ort 2.x，DirectML 执行提供者（download-binaries/copy-dylibs 默认开，
# 自动把 DirectML.dll 放到 target/{debug,release}/，dev 模式无需改 tauri.conf.json）。
# RTX 5090 是 sm_120，CUDA EP 暂无 kernel，DirectML 走 DX12 是当前唯一稳路。
ort = { version = "2.0.0-rc.13", features = ["directml"] }
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "ico"] }
# 图像转矢量（阶段一）：纯 Rust，CPU。走文件接口 convert_image_to_svg，绕开它内部 image 0.23 与本项目 0.25 的版本差异。
vtracer = "0.6.5"
# PathSimplifyMode（少节点档的多边形模式）在 visioncortex 里，vtracer 未 re-export；
# 版本与 vtracer 0.6.5 的依赖对齐（已在依赖树中，不引入新包）
visioncortex = "0.8.10"
# 矢量候选评分（批次5）：SVG → 位图渲染对比原图。纯 Rust（tiny-skia），无系统依赖；
# 只用 resvg 一个 crate——它内部 re-export usvg 与 tiny_skia，版本天然对齐。
resvg = "0.45"
# 分层 TIFF：同尺寸 RGBA 图层写为多页 TIFF，并写入图层名与 DPI 元数据。
tiff = "0.11.3"
# 读取 JPEG/PNG/WebP 容器中的原始 ICC 配置，并原样写回生产输出。
img-parts = "0.4.0"

# —— 系统资源监控（画布仪表盘）——
# sysinfo：CPU / 内存占用；nvml-wrapper：运行时加载 nvml.dll 读 NVIDIA 显卡核心占用与显存（非 N 卡降级 None）
sysinfo = "0.37"
nvml-wrapper = "0.11"
